name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LYHLab-v0.1.1-source.zip'
      - '.github/workflows/ios-unsigned.yml'
permissions:
  contents: read
concurrency:
  group: lyhlab-ios-main
  cancel-in-progress: true
jobs:
  unsigned-ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify and expand reviewed source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '66da175dddfd02c71bac190d0fef3bf14d478486c756b2a0baa1482099a6f047' LYHLab-v0.1.1-source.zip | shasum -a 256 -c -
          unzip -q LYHLab-v0.1.1-source.zip -d source
          cd source
          shasum -a 256 -c SHA256SUMS.txt
          python3 verify_source.py
          xcodebuild -version
          xcodebuild -list -project LYHLab.xcodeproj
          swiftc LYHLab/Models.swift Tests/ModelsSmoke.swift -o "$RUNNER_TEMP/lyhlab-model-tests"
          "$RUNNER_TEMP/lyhlab-model-tests"
      - name: Compile the unsigned iPhone device app
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          xcodebuild -project LYHLab.xcodeproj -scheme LYHLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/lyhlab-derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' build 2>&1 | tee "$GITHUB_WORKSPACE/output/xcodebuild.log"
      - name: Validate arm64 device product and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/lyhlab-derived/Build/Products/Release-iphoneos/LYHLab.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'cn.lyhlab.procurement'
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          xcrun lipo "$APP/$BIN" -verify_arch arm64
          STAGE="$RUNNER_TEMP/lyhlab-ipa"
          mkdir -p "$STAGE/Payload"
          ditto "$APP" "$STAGE/Payload/LYHLab.app"
          (cd "$STAGE" && zip -q -r "$GITHUB_WORKSPACE/output/LYHLab-unsigned.ipa" Payload)
          unzip -t output/LYHLab-unsigned.ipa
          (cd output && shasum -a 256 LYHLab-unsigned.ipa > SHA256SUMS.txt)
          echo 'Unsigned iPhone device build. Requires local re-signing. No iPhone runtime test.' > output/UNSIGNED-README.txt
      - name: Upload IPA or compile diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LYHLab-iOS-unsigned
          path: |
            output/LYHLab-unsigned.ipa
            output/SHA256SUMS.txt
            output/UNSIGNED-README.txt
            output/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
